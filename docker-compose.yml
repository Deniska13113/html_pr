services:
  web_80:
    image: nginx:latest
    container_name: site_443
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/coldenspace.com/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/coldenspace.com/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      - .:/usr/share/nginx/html:ro