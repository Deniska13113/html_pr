services:
  web_80:
    build: site_80
    ports:
      - "80:80"
      - "443:443"
    restart: always
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/coldenspace.com/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/coldenspace.com/privkey.pem:/etc/nginx/ssl/privkey.pem:ro