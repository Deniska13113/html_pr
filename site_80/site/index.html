<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Сообщение</title>

  <style>
	.text {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
		color: rgb(255, 52, 119);
		font-size: 26px;
		animation: blink 2s infinite;
    text-align: center;
    padding: 50px;
    }


	@keyframes blink {
		0% {
			opacity: 1;
			}
			50% {
				opacity: 0;
				}
				100% {
					opacity: 1;
					}
					}


    img {
      width: 150px;
      position: relative;
      animation: move 1s infinite normal;
    }


    @keyframes move {
      from {left: 100px; }
      to {right: 100px; }
    }
      

    body {
      padding :30px;
      text-align: center;
      background: #ffb7e8;
      font-family: Arial, sans-serif;
    }

    .custom-image {
      margin-top: 20px;
      width: 150px;
      pointer-events: none;
    }

    button {
    background: white;
    color: #ff4b6e;
    border: none;
    padding: 15px 25px;
    font-size: 18px;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
    margin: 10px;
        position: relative;
    z-index: 10;
    }
    .secretText {
    
      .secretText {
  display: none;
  font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
  color: rgb(255, 52, 119);
  font-size: 26px;
  text-align: center;
  margin-top: 20px;
}

.show {
  display: block !important;
  animation: spinDisappear 3s forwards;
}

@keyframes spinDisappear {
  0% {
    opacity: 0;
    transform: scale(0.5) rotate(0deg);
  }

  20% {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }

  80% {
    opacity: 1;
    transform: scale(1.2) rotate(720deg);
  }

  100% {
    opacity: 0;
    transform: scale(0) rotate(1080deg);
  }
    }

  </style>
</head>

<body>
  <img src = "kit.png" width="400">
  
  
  <div class="text">
    <p>
    Доброе утро, любовь моя, чуть чуть поигрался чтобы отдохнуть от плюсов. Забавная тема
    Надеюсь ти выспалась, люблю тебя!!!
    </p>
    <p>
    PS
    </p>
    <p> 
    Если тебе вдруг хочется поиграться попробуй добавить кнопки, а я попробую написать на ++ действия на эти кнопки (если получиться)
    </p>
  </div>
   <img src = "pngtree-smooth-glossy-heart-vector-file-ai-and-png-png-image_4557871.png" class="custom-image">


  <div class ="button">
    <button id="showButton"> нажми на меня </button>
    <div id="secretText" class = "secretText"> 
    if you´re reading this, i love u!! 
    </div>
  </div>
  <script>
  document.getElementById("showButton").addEventListener("click", function () {

    let text = document.getElementById("secretText");

    this.style.display = "none";

    text.classList.add("show");

    setTimeout(function () {
        text.classList.remove("show");
        text.style.display = "none";
    }, 3000);

});
</script>

</body>
</html>
