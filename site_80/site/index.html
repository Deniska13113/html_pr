<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Сообщение</title>

  <style>
	.text {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
		color: rgb(255, 52, 119);
		font-size: 26px;
		animation: blink 2s infinite;
    text-align: center;
    padding: 50px;
    }


	@keyframes blink {
		0% {
			opacity: 1;
			}
			50% {
				opacity: 0;
				}
				100% {
					opacity: 1;
					}
					}


    img {
      width: 150px;
      position: relative;
      animation: move 1s infinite normal;
    }


    @keyframes move {
      from {left: 100px; }
      to {right: 100px; }
    }
      

    body {
      padding :30px;
      text-align: center;
      background: #ffb7e8;
      font-family: Arial, sans-serif;
    }

    .custom-image {
      margin-top: 20px;
      width: 150px;
      pointer-events: none;
    }

    button {
    background: white;
    color: #ff4b6e;
    border: none;
    padding: 15px 25px;
    font-size: 18px;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
    margin: 10px;
        position: relative;
    z-index: 10;
    }
    .secretText
    {
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
		color: rgb(255, 52, 119);
		font-size: 26px;
		animation: blink 2s infinite;
    text-align: center;
    padding: 50px;
    }

  </style>
</head>

<body>
  <img src = "png-transparent-white-beige-and-pink-cat-illustration-keyboard-cat-computer-keyboard-hello-kitty-kitten-love-white-mammal-animals.png" width="400">

    <p>

  </div>
   <img src = "pngtree-smooth-glossy-heart-vector-file-ai-and-png-png-image_4557871.png" class="custom-image">

</script>

</html>
