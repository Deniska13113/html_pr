<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Angel site</title>
  <link rel="icon" type="image/png" href="images.png">

  <style>
	.text {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
		color: rgb(255, 52, 119);
		font-size: 26px;
		animation: blink 2s infinite;
    text-align: center;
    padding: 50px;
    }


	@keyframes blink {
		0% {
			opacity: 1;
			}
			50% {
				opacity: 0;
				}
				100% {
					opacity: 1;
					}
					}


    img {
  width: 150px;
}

    body {
      padding :30px;
      text-align: center;
      background: #ffb7e8;
      font-family: Arial, sans-serif;
    }

    .custom-image {
      margin-top: 20px;
      width: 150px;
      pointer-events: none;
    }
    .cat {
  width: 250px;
  position: relative;
  animation: flyCat 4s ease-in-out infinite alternate;
}

@keyframes flyCat {
  0% {
    transform: translateX(-80px);
  }

  100% {
    transform: translateX(80px);
  }
}

    button {
    background: white;
    color: #ff4b6e;
    border: none;
    padding: 15px 25px;
    font-size: 18px;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
    margin: 10px;
        position: relative;
    z-index: 10;
    }
    .question {
    color: rgb(255, 52, 119);
    font-size: 30px;
    font-family: 'Gill Sans', sans-serif;
}

.buttons {
    position: relative;
    height: 200px;
}

#yesButton,
#noButton {
    position: absolute;
    width: 120px;
}

#yesButton {
    left: 40%;
    top: 20px;
}

#noButton {
    left: 55%;
    top: 20px;
}
    .secretText {
  display: none;
  font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
  color: rgb(255, 52, 119);
  font-size: 26px;
  text-align: center;
  margin-top: 20px;
}

.show {
  display: block !important;
  animation: spinDisappear 3s forwards;
}

@keyframes spinDisappear {
  0% {
    opacity: 0;
    transform: scale(0.5) rotate(0deg);
  }

  20% {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }

  80% {
    opacity: 1;
    transform: scale(1.2) rotate(720deg);
  }

  100% {
    opacity: 0;
    transform: scale(0) rotate(1080deg);
  }
    }

  </style>
</head>

<body>
  <img src = "kit.png" class="cat">
  
  
  <div class="text">
    <p>
      Какая каптильня в клд, я не могу, надеюсь у тебя все хорошо, любовь моя!!!
    </p>
  </div>
   <img src = "pngtree-smooth-glossy-heart-vector-file-ai-and-png-png-image_4557871.png" class="custom-image">


  <h2 class="question">Ты меня ещё любишь?</h2>

<div class="buttons">
    <button id="yesButton">Нет</button>
    <button id="noButton">Да</button>
</div>

<div id="secretText" class="secretText">
    И я тебя, любовь моя!!! 
</div>
  <script>
const yesButton = document.getElementById("yesButton");
const noButton = document.getElementById("noButton");
const secretText = document.getElementById("secretText");

// Кнопка "Да" убегает
yesButton.addEventListener("mouseover", function () {

    const maxX = window.innerWidth - yesButton.offsetWidth - 20;
    const maxY = window.innerHeight - yesButton.offsetHeight - 20;

    const x = Math.random() * (window.innerWidth - 150);
const y = Math.random() * (window.innerHeight - 150);

    yesButton.style.left = x + "px";
    yesButton.style.top = y + "px";
});

// Кнопка "Нет"
noButton.addEventListener("click", function () {

    secretText.classList.add("show");

    setTimeout(() => {
        secretText.classList.remove("show");
    }, 3000);

});
</script>

</body>
</html>
