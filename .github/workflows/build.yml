name: Build
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            os: [label-1, X64]
    steps:
      - name: Update repository
        run: |
          cd /home/user/docker_site
          git pull origin main

      - name: Restart containers
        run: |
          cd /home/user/docker_site
          sudo docker compose down
          sudo docker compose up -d --build