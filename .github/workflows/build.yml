name: Build
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update repository
        run: |
          cd /home/user/docker_site
          git pull origin main

      - name: Restart containers
        run: |
          cd /home/user/site
          docker compose down
          docker compose up -d --build