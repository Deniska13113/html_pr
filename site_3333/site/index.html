<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Таймер</title>
  <link rel="short icon" href="heart.png" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      
      display: flex;
      justify-content: center;
      align-items: center;
      background: #bb43a1;
      color: white;
      font-family: Arial, sans-serif; 
      font-size: 26px;
    }
    .text
    {
      font-family: Arial, sans-serif; 
      font-size: 48px;
      padding: 10px;
      text-align: center;
    }
    .custom-image
    {
      width: 400px;
    }
	p{
		font-size: 60px;
	}
    #timer {
      font-size: 60px;
      font-weight: bold;
    }
  </style>
</head>



<body>
<did class = "text"> До приезда Элиши </div>
<div class = "text"> Очень ждю!!!! </div>
<div id="timer"></div>
<img src = "heart.png" class="custom-image">

<script>
  // Дата события
  const eventDate = new Date("2026-07-19T18:00:00").getTime();

  function updateTimer() {
    const now = new Date().getTime();
    const diff = eventDate - now;

    if (diff <= 0) {
      document.getElementById("timer").innerHTML = "Событие наступило!";
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("timer").innerHTML =
      `${days}д ${hours}ч ${minutes}м ${seconds}с`;
  }

  updateTimer();
  setInterval(updateTimer, 1000);
</script>

</body>
</html>
